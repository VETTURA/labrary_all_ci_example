name: Lint and Test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run black
        run: black --diff --config configs/pyproject.toml .

      - name: Run flake8
        run: flake8 --config=configs/.flake8 .

      - name: Run mypy
        run: mypy --config-file=configs/mypy.ini .

      - name: Run tests with coverage
        run: pytest --cov=library --cov-report=term

      # - name: Build HTML docs
      #   run: |
      #     python -m sphinx.ext.apidoc -o docs .
      #     sphinx-build -b html docs docs/build/html

      # - name: Deploy to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v3
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: docs/_build/html

      - name: Build HTML docs
        run: |
          sphinx-build docs/source docs/build

      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v3
        with:
          allow_empty_commit: true
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/build/

  docker:
    runs-on: ubuntu-latest
    needs: docs

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/library-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/library-app:latest